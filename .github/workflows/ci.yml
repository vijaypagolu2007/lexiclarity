name: Platform Evaluation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-assessment:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm

    - name: Set up Python 3.11
      uses: setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        npm ci

    - name: Typecheck and build web application
      run: |
        npm run typecheck
        npm run build
        npm run test:api

    - name: Code Quality & Lint Check (Ruff)
      run: |
        pip install ruff
        ruff check .

    - name: Execute Pytest Suite with Coverage
      run: |
        pytest tests/ -v --cov=core --cov=src --cov-report=term-missing --cov-fail-under=85

    - name: Verify Repo Size (< 10 MB limit)
      run: |
        REPO_SIZE_KB=$(git count-objects -v | grep 'size-pack' | awk '{print $2}')
        if [ -z "$REPO_SIZE_KB" ]; then REPO_SIZE_KB=$(du -sk .git | awk '{print $1}'); fi
        echo "Current Repo Size: ${REPO_SIZE_KB} KB"
        if [ "$REPO_SIZE_KB" -gt 10240 ]; then
          echo "ERROR: Repository exceeds 10 MB evaluation limit!"
          exit 1
        else
          echo "SUCCESS: Repository size is within limits."
        fi
